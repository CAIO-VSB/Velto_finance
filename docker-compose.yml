services: 
  # SERVIÇO 1: Banco de Dados PostgreSQL
  postgres_db:
    image: postgres:18-alpine
    container_name: velto-db
    environment: 
      POSTGRES_USER: ${USER_DATABASE}
      POSTGRES_PASSWORD: ${PASSWORD_DATABASE}
      POSTGRES_DB: ${DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nuxt_network

  # SERVIÇO 2: Aplicação Nuxt 4 em Ambiente de Desenvolvimento
  nuxt_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: velto-app
    ports: 
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      MATCHPAK_POLLING: "true"
    command: npx nuxt dev --host 0.0.0.0 --port 3000
    volumes: 
      - .:/app
      - /app/node_modules 
    depends_on:
      - postgres_db
    networks:
      - nuxt_network

volumes:
  postgres_data:

networks: 
  nuxt_network:
    driver: bridge
